<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishauq's Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="custom.css" />
</head>
<body>

  <!-- ════════════════════════════════════════
       LOADING SCREEN
       ════════════════════════════════════════ -->
  <div id="loader">
    <div class="loader-bg"></div>
    <canvas id="fairy-canvas"></canvas>

    <div class="loader-center">
      <div class="loader-sigil">✦</div>
      <h1 class="loader-title">Ishauq's Notes</h1>
      <p class="loader-sub">A quiet place for clear thinking.</p>
      <div class="loader-bar-wrap">
        <div class="loader-bar" id="loader-bar"></div>
      </div>
      <p class="loader-hint" id="loader-hint">Opening the tome…</p>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       MAIN APP
       ════════════════════════════════════════ -->
  <div class="layout" id="app" style="opacity:0;pointer-events:none;">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <h1>Ishauq's Notes</h1>
        <p>A quiet place for clear thinking.</p>
      </div>

      <div class="divider"></div>

      <div class="menu-wrap">
        <div class="menu-title">
          <span class="menu-title-icon">◈</span>
          Pages
        </div>
        <nav id="menu" class="menu"></nav>
      </div>

      <div class="divider"></div>

      <!-- ── Music Player ── -->
      <div class="music-wrap">
        <div class="menu-title">
          <span class="menu-title-icon">♪</span>
          Music
          <button id="music-toggle" class="music-toggle-btn" title="Play / Pause">
            <span id="music-toggle-icon">▶</span>
          </button>
        </div>
        <nav id="music-menu" class="menu music-menu"></nav>
        <div id="music-now-playing" class="music-now-playing hidden">
          <div class="music-vinyl"><div class="music-vinyl-inner"></div></div>
          <div class="music-info">
            <div id="music-track-title" class="music-track-title">—</div>
            <div id="music-track-artist" class="music-track-artist">—</div>
          </div>
        </div>
      </div>

      <audio id="audio-player" loop style="display:none;"></audio>

      <div class="sidebar-footer">
        <span>RTOS · Embedded Systems</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-inner">
          <h2 id="page-title">Loading...</h2>
          <div class="topbar-badge">Note</div>
        </div>
        <div class="topbar-line"></div>
      </header>
      <article id="content" class="content">
        <p class="muted">Loading notes...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
  /* ══════════════════════════════════════════════════════
     LOADING SCREEN — 7 seconds, fairy notes canvas
     ══════════════════════════════════════════════════════ */
  (function () {
    const DURATION   = 7000; // ms
    const loaderEl   = document.getElementById("loader");
    const appEl      = document.getElementById("app");
    const barEl      = document.getElementById("loader-bar");
    const hintEl     = document.getElementById("loader-hint");
    const canvas     = document.getElementById("fairy-canvas");
    const ctx        = canvas.getContext("2d");

    const hints = [
      "Opening the tome…",
      "Lighting the candles…",
      "Unrolling the scrolls…",
      "Summoning the quill…",
      "Almost ready…"
    ];

    /* ── Resize canvas ── */
    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /* ── Fairy note particles ── */
    const GLYPHS = ["♩","♪","♫","♬","✦","◈","§","¶","✿","❧","☙","✎","📜","⚜"];
    const particles = [];

    function randomBetween(a, b) { return a + Math.random() * (b - a); }

    function spawnParticle() {
      const glyph = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      const size  = randomBetween(12, 30);
      // warm parchment palette colours
      const colors = [
        "rgba(61,107,82,",   // accent green
        "rgba(90,81,71,",    // text-soft brown
        "rgba(138,127,115,", // muted
        "rgba(46,42,36,",    // dark brown
        "rgba(181,201,190,", // light green
      ];
      const col = colors[Math.floor(Math.random() * colors.length)];
      particles.push({
        x:       randomBetween(0, canvas.width),
        y:       canvas.height + size + 10,
        vx:      randomBetween(-0.6, 0.6),
        vy:      randomBetween(-1.4, -0.5),
        size,
        glyph,
        col,
        alpha:   0,
        alphaV:  randomBetween(0.008, 0.02),
        phase:   randomBetween(0, Math.PI * 2),
        wobble:  randomBetween(0.01, 0.03),
        wobbleA: randomBetween(0.4, 1.2),
        rot:     randomBetween(-0.3, 0.3),
        rotV:    randomBetween(-0.008, 0.008),
        life:    1,
        lifeV:   randomBetween(0.003, 0.007),
      });
    }

    /* Spawn particles over time */
    let lastSpawn = 0;
    function maybeSpawn(now) {
      if (now - lastSpawn > 120 && particles.length < 55) {
        spawnParticle();
        lastSpawn = now;
      }
    }

    /* ── Render loop ── */
    let startTime = null;
    let hintIndex = 0;
    let lastHint  = 0;

    function tick(now) {
      if (!startTime) startTime = now;
      const elapsed  = now - startTime;
      const progress = Math.min(elapsed / DURATION, 1);

      /* Update hint text */
      const hintStep = Math.floor(progress * hints.length);
      if (hintStep !== hintIndex) {
        hintIndex = Math.min(hintStep, hints.length - 1);
        hintEl.style.opacity = "0";
        setTimeout(() => {
          hintEl.textContent  = hints[hintIndex];
          hintEl.style.opacity = "1";
        }, 200);
      }

      /* Progress bar */
      barEl.style.width = (progress * 100) + "%";

      /* Spawn & draw particles */
      maybeSpawn(now);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.phase += p.wobble;
        p.x     += p.vx + Math.sin(p.phase) * p.wobbleA;
        p.y     += p.vy;
        p.rot   += p.rotV;
        p.life  -= p.lifeV;

        if (p.alpha < 1) p.alpha = Math.min(p.alpha + p.alphaV, 0.85);
        const a = p.life < 0.3 ? (p.life / 0.3) * p.alpha : p.alpha;

        if (p.life <= 0 || p.y < -40) { particles.splice(i, 1); continue; }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.font        = `${p.size}px "Lora", Georgia, serif`;
        ctx.fillStyle   = p.col + a + ")";
        ctx.textAlign   = "center";
        ctx.textBaseline = "middle";
        /* Soft glow */
        ctx.shadowColor  = p.col + "0.4)";
        ctx.shadowBlur   = 8;
        ctx.fillText(p.glyph, 0, 0);
        ctx.restore();
      }

      if (progress < 1) {
        requestAnimationFrame(tick);
      } else {
        /* Fade loader out, reveal app */
        loaderEl.style.transition = "opacity 0.9s ease";
        loaderEl.style.opacity    = "0";
        appEl.style.transition    = "opacity 0.9s ease 0.4s";
        appEl.style.opacity       = "1";
        appEl.style.pointerEvents = "all";
        setTimeout(() => loaderEl.style.display = "none", 1400);
      }
    }

    requestAnimationFrame(tick);
  })();


  /* ══════════════════════════════════════════════════════
     NOTES APP
     ══════════════════════════════════════════════════════ */
  const CONFIG = {
    owner:     "mdishauq",
    repo:      "NOTES_WEBSITE",
    branch:    "main",
    notesPath: "notes",
    musicPath: "music",
    musicFile: "music.json"
  };

  const menuEl          = document.getElementById("menu");
  const contentEl       = document.getElementById("content");
  const pageTitleEl     = document.getElementById("page-title");
  const musicMenuEl     = document.getElementById("music-menu");
  const nowPlayingEl    = document.getElementById("music-now-playing");
  const trackTitleEl    = document.getElementById("music-track-title");
  const trackArtistEl   = document.getElementById("music-track-artist");
  const musicToggleBtn  = document.getElementById("music-toggle");
  const musicToggleIcon = document.getElementById("music-toggle-icon");
  const audioPlayer     = document.getElementById("audio-player");

  function toTitle(f) { return f.replace(/\.md$/i,"").replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
  function encodePath(p) { return String(p).split("/").map(s=>encodeURIComponent(s)).join("/"); }
  function rawUrl(p) { return "https://raw.githubusercontent.com/"+CONFIG.owner+"/"+CONFIG.repo+"/"+CONFIG.branch+"/"+encodePath(p); }
  function apiContentsUrl(p) { return "https://api.github.com/repos/"+CONFIG.owner+"/"+CONFIG.repo+"/contents/"+encodePath(p)+"?ref="+encodeURIComponent(CONFIG.branch); }
  function normalizePath(p) {
    const parts=String(p).split("/"),s=[];
    for(const x of parts){if(!x||x===".")continue;if(x==="..")s.length&&s.pop();else s.push(x);}
    return s.join("/");
  }
  function extractUrlValue(i) {
    if(typeof i==="string")return i.trim();
    if(!i||typeof i!=="object")return"";
    return(i.href||i.url||"").trim();
  }
  function resolveRelativeUrl(cur, inp) {
    const c=extractUrlValue(inp);
    if(!c)return"";
    if(/^(https?:|#|mailto:|data:)/.test(c))return c;
    const dir=cur.includes("/")?cur.slice(0,cur.lastIndexOf("/")+1):"";
    return rawUrl(normalizePath(dir+c));
  }
  function rewriteRelativeLinksAndImages(html, cur) {
    const t=document.createElement("div");t.innerHTML=html;
    t.querySelectorAll("a[href]").forEach(a=>{
      const r=resolveRelativeUrl(cur,a.getAttribute("href")||"");
      if(r)a.setAttribute("href",r);
      if(/^https?:/.test(a.getAttribute("href")||"")){a.setAttribute("target","_blank");a.setAttribute("rel","noopener noreferrer");}
    });
    t.querySelectorAll("img[src]").forEach(img=>{
      const r=resolveRelativeUrl(cur,img.getAttribute("src")||"");
      if(r)img.setAttribute("src",r);
    });
    return t.innerHTML;
  }
  async function getMarkdownFiles() {
    const res=await fetch(apiContentsUrl(CONFIG.notesPath));
    if(!res.ok)throw new Error("Failed to read notes folder.");
    const items=await res.json();
    if(!Array.isArray(items))throw new Error("Notes path invalid.");
    return items.filter(i=>i.type==="file"&&i.name.toLowerCase().endsWith(".md"))
      .map(i=>({name:i.name,path:i.path,title:toTitle(i.name)}))
      .sort((a,b)=>a.title.localeCompare(b.title));
  }
  function renderMenu(files) {
    menuEl.innerHTML="";
    files.forEach((f,i)=>{
      const a=document.createElement("a");
      a.href="#/"+encodeURIComponent(f.path);
      a.textContent=f.title; a.dataset.path=f.path;
      a.className="menu-item"; a.style.animationDelay=(i*60)+"ms";
      menuEl.appendChild(a);
    });
  }
  function setActive(path) {
    menuEl.querySelectorAll(".menu-item").forEach(l=>l.classList.toggle("active",l.dataset.path===path));
  }
  function pathFromHash() {
    const h=window.location.hash||"";
    if(!h.startsWith("#/"))return"";
    return decodeURIComponent(h.slice(2));
  }
  async function loadPage(path) {
    try {
      pageTitleEl.textContent="Loading…";
      contentEl.style.opacity="0"; contentEl.style.transform="translateY(6px)";
      const res=await fetch(rawUrl(path));
      if(!res.ok)throw new Error("Failed to load markdown file.");
      const md=await res.text();
      const html=marked.parse(md,{gfm:true,breaks:false});
      contentEl.innerHTML=DOMPurify.sanitize(rewriteRelativeLinksAndImages(html,path),{ADD_ATTR:["target","rel"]});
      pageTitleEl.textContent=toTitle(path.split("/").pop()||path);
      setActive(path);
      requestAnimationFrame(()=>{
        contentEl.style.transition="opacity 0.3s ease, transform 0.3s ease";
        contentEl.style.opacity="1"; contentEl.style.transform="translateY(0)";
      });
    } catch(err) {
      pageTitleEl.textContent="Error";
      contentEl.innerHTML='<p class="muted">'+(err?.message||"Unknown error")+"</p>";
      contentEl.style.opacity="1"; contentEl.style.transform="none";
    }
  }

  /* ── Music ── */
  let currentTrack=null, isPlaying=false;
  function mp3Url(f) { return rawUrl(CONFIG.musicPath+"/"+f); }
  function syncToggleBtn() {
    musicToggleIcon.textContent=isPlaying?"⏸":"▶";
    musicToggleBtn.title=isPlaying?"Pause":"Play";
    const v=document.querySelector(".music-vinyl");
    if(v) v.style.animationPlayState=isPlaying?"running":"paused";
  }
  function playTrack(track) {
    currentTrack=track;
    audioPlayer.src=mp3Url(track.file);
    audioPlayer.load();
    audioPlayer.play().then(()=>{isPlaying=true;syncToggleBtn();}).catch(()=>{isPlaying=false;syncToggleBtn();});
    trackTitleEl.textContent=track.title;
    trackArtistEl.textContent=track.artist||"";
    nowPlayingEl.classList.remove("hidden");
    musicMenuEl.querySelectorAll(".music-item").forEach(el=>el.classList.toggle("active",el.dataset.file===track.file));
  }
  musicToggleBtn.addEventListener("click",()=>{
    if(!currentTrack)return;
    if(isPlaying){audioPlayer.pause();isPlaying=false;}
    else{audioPlayer.play();isPlaying=true;}
    syncToggleBtn();
  });
  audioPlayer.addEventListener("play", ()=>{isPlaying=true; syncToggleBtn();});
  audioPlayer.addEventListener("pause",()=>{isPlaying=false;syncToggleBtn();});

  async function loadMusicTracks() {
    try {
      const res=await fetch(rawUrl(CONFIG.musicFile));
      if(!res.ok)throw new Error();
      const tracks=await res.json();
      musicMenuEl.innerHTML="";
      tracks.forEach((track,i)=>{
        const a=document.createElement("a");
        a.href="#"; a.className="menu-item music-item";
        a.dataset.file=track.file; a.style.animationDelay=(i*60)+"ms";
        a.innerHTML=`<span class="music-item-note">♩</span>
          <span class="music-item-info">
            <span class="music-item-title">${track.title}</span>
            ${track.artist?`<span class="music-item-artist">${track.artist}</span>`:""}
          </span>`;
        a.addEventListener("click",e=>{e.preventDefault();playTrack(track);});
        musicMenuEl.appendChild(a);
      });
    } catch {
      musicMenuEl.innerHTML='<p class="muted" style="padding:10px;font-size:0.8rem;">Add music.json to your repo root.</p>';
    }
  }

  /* ── Boot ── */
  async function boot() {
    try {
      const files=await getMarkdownFiles();
      if(!files.length){
        pageTitleEl.textContent="No Pages";
        contentEl.innerHTML='<p class="muted">No markdown files found.</p>';
        return;
      }
      renderMenu(files);
      let target=pathFromHash();
      if(!target||!files.some(f=>f.path===target)){
        target=files[0].path;
        window.location.hash="#/"+encodeURIComponent(target);
      }
      await loadPage(target);
    } catch(err) {
      pageTitleEl.textContent="Setup Needed";
      contentEl.innerHTML='<p class="muted">'+(err?.message||"Unknown setup error")+"</p>";
    }
  }
  window.addEventListener("hashchange",()=>{const p=pathFromHash();if(p)loadPage(p);});
  boot();
  loadMusicTracks();
  </script>
</body>
</html>
