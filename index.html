<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishauq's Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="custom.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <h1>Ishauq's Notes</h1>
        <p>A quiet place for clear thinking.</p>
      </div>

      <div class="divider"></div>

      <div class="menu-wrap">
        <div class="menu-title">
          <span class="menu-title-icon">◈</span>
          Pages
        </div>
        <nav id="menu" class="menu"></nav>
      </div>

      <div class="sidebar-footer">
        <span>RTOS · Embedded Systems</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-inner">
          <h2 id="page-title">Loading...</h2>
          <div class="topbar-badge">Note</div>
        </div>
        <div class="topbar-line"></div>
      </header>

      <article id="content" class="content">
        <p class="muted">Loading notes...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const CONFIG = {
      owner: "mdishauq",
      repo: "NOTES_WEBSITE",
      branch: "main",
      notesPath: "notes"
    };

    const menuEl = document.getElementById("menu");
    const contentEl = document.getElementById("content");
    const pageTitleEl = document.getElementById("page-title");

    function toTitle(fileName) {
      return fileName
        .replace(/\.md$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function encodePath(path) {
      return String(path).split("/").map(seg => encodeURIComponent(seg)).join("/");
    }

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" +
        CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + encodePath(path);
    }

    function apiContentsUrl(path) {
      return "https://api.github.com/repos/" +
        CONFIG.owner + "/" + CONFIG.repo + "/contents/" +
        encodePath(path) + "?ref=" + encodeURIComponent(CONFIG.branch);
    }

    function normalizePath(path) {
      const parts = String(path).split("/");
      const stack = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") { if (stack.length) stack.pop(); continue; }
        stack.push(part);
      }
      return stack.join("/");
    }

    function extractUrlValue(input) {
      if (typeof input === "string") return input.trim();
      if (!input || typeof input !== "object") return "";
      if (typeof input.href === "string") return input.href.trim();
      if (typeof input.url === "string") return input.url.trim();
      return "";
    }

    function resolveRelativeUrl(currentFilePath, urlInput) {
      const clean = extractUrlValue(urlInput);
      if (!clean) return "";
      if (clean.startsWith("http://") || clean.startsWith("https://") ||
          clean.startsWith("#") || clean.startsWith("mailto:") || clean.startsWith("data:")) {
        return clean;
      }
      const currentDir = currentFilePath.includes("/")
        ? currentFilePath.slice(0, currentFilePath.lastIndexOf("/") + 1) : "";
      return rawUrl(normalizePath(currentDir + clean));
    }

    function rewriteRelativeLinksAndImages(html, currentFilePath) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      temp.querySelectorAll("a[href]").forEach(a => {
        const resolved = resolveRelativeUrl(currentFilePath, a.getAttribute("href") || "");
        if (resolved) a.setAttribute("href", resolved);
        const href = a.getAttribute("href") || "";
        if (href.startsWith("http://") || href.startsWith("https://")) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        }
      });
      temp.querySelectorAll("img[src]").forEach(img => {
        const resolved = resolveRelativeUrl(currentFilePath, img.getAttribute("src") || "");
        if (resolved) img.setAttribute("src", resolved);
      });
      return temp.innerHTML;
    }

    async function getMarkdownFiles() {
      const response = await fetch(apiContentsUrl(CONFIG.notesPath));
      if (!response.ok) throw new Error("Failed to read notes folder. Check owner, repo, branch, notes path, and repository visibility.");
      const items = await response.json();
      if (!Array.isArray(items)) throw new Error("Notes path is invalid or not a folder.");
      return items
        .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".md"))
        .map(item => ({ name: item.name, path: item.path, title: toTitle(item.name) }))
        .sort((a, b) => a.title.localeCompare(b.title));
    }

    function renderMenu(files) {
      menuEl.innerHTML = "";
      files.forEach((file, i) => {
        const a = document.createElement("a");
        a.href = "#/" + encodeURIComponent(file.path);
        a.textContent = file.title;
        a.dataset.path = file.path;
        a.className = "menu-item";
        a.style.animationDelay = (i * 60) + "ms";
        menuEl.appendChild(a);
      });
    }

    function setActive(path) {
      menuEl.querySelectorAll(".menu-item").forEach(link => {
        link.classList.toggle("active", link.dataset.path === path);
      });
    }

    function pathFromHash() {
      const hash = window.location.hash || "";
      if (!hash.startsWith("#/")) return "";
      return decodeURIComponent(hash.slice(2));
    }

    async function loadPage(path) {
      try {
        pageTitleEl.textContent = "Loading…";
        contentEl.style.opacity = "0";
        contentEl.style.transform = "translateY(6px)";

        const res = await fetch(rawUrl(path));
        if (!res.ok) throw new Error("Failed to load markdown file.");
        const md = await res.text();

        const html = marked.parse(md, { gfm: true, breaks: false });
        const rewritten = rewriteRelativeLinksAndImages(html, path);
        contentEl.innerHTML = DOMPurify.sanitize(rewritten, { ADD_ATTR: ["target", "rel"] });

        pageTitleEl.textContent = toTitle(path.split("/").pop() || path);
        setActive(path);

        requestAnimationFrame(() => {
          contentEl.style.transition = "opacity 0.3s ease, transform 0.3s ease";
          contentEl.style.opacity = "1";
          contentEl.style.transform = "translateY(0)";
        });
      } catch (err) {
        pageTitleEl.textContent = "Error";
        contentEl.innerHTML = '<p class="muted">' + (err?.message || "Unknown error") + "</p>";
        contentEl.style.opacity = "1";
        contentEl.style.transform = "none";
      }
    }

    async function boot() {
      try {
        const files = await getMarkdownFiles();
        if (!files.length) {
          pageTitleEl.textContent = "No Pages";
          contentEl.innerHTML = '<p class="muted">No markdown files found in notes.</p>';
          return;
        }
        renderMenu(files);
        let target = pathFromHash();
        if (!target || !files.some(f => f.path === target)) {
          target = files[0].path;
          window.location.hash = "#/" + encodeURIComponent(target);
        }
        await loadPage(target);
      } catch (err) {
        pageTitleEl.textContent = "Setup Needed";
        contentEl.innerHTML = '<p class="muted">' + (err?.message || "Unknown setup error") + "</p>";
      }
    }

    window.addEventListener("hashchange", () => {
      const path = pathFromHash();
      if (path) loadPage(path);
    });

    boot();
  </script>
</body>
</html>
