<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTOS Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="custom.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>RTOS Notes</h1>
        <p>Each markdown file in the notes folder becomes a page.</p>
      </div>

      <div class="menu-wrap">
        <div class="menu-title">Pages</div>
        <nav id="menu" class="menu"></nav>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Loading...</h2>
      </header>

      <article id="content" class="content">
        <p class="muted">Loading notes...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const CONFIG = {
      owner: "mdishauq",
      repo: "NOTES_WEBSITE",
      branch: "main",
      notesPath: "notes"
    };

    const menuEl = document.getElementById("menu");
    const contentEl = document.getElementById("content");
    const pageTitleEl = document.getElementById("page-title");

    function toTitle(fileName) {
      return fileName
        .replace(/\.md$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" +
        CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + path;
    }

    function apiContentsUrl(path) {
      return "https://api.github.com/repos/" +
        CONFIG.owner + "/" + CONFIG.repo + "/contents/" +
        encodeURIComponent(path) + "?ref=" + CONFIG.branch;
    }

    function normalizePath(path) {
      const parts = path.split("/");
      const stack = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (stack.length) stack.pop();
          continue;
        }
        stack.push(part);
      }
      return stack.join("/");
    }

    function resolveRelativeUrl(currentFilePath, url) {
      const clean = (url || "").trim();
      if (!clean) return clean;
      if (
        clean.startsWith("http://") ||
        clean.startsWith("https://") ||
        clean.startsWith("#") ||
        clean.startsWith("mailto:") ||
        clean.startsWith("data:")
      ) {
        return clean;
      }

      const currentDir = currentFilePath.includes("/")
        ? currentFilePath.slice(0, currentFilePath.lastIndexOf("/") + 1)
        : "";
      const combined = normalizePath(currentDir + clean);
      return rawUrl(combined);
    }

    async function getMarkdownFiles() {
      const response = await fetch(apiContentsUrl(CONFIG.notesPath));
      if (!response.ok) {
        throw new Error("Failed to read notes folder. Check owner, repo, branch, and notes path.");
      }

      const items = await response.json();
      return items
        .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".md"))
        .map(item => ({
          name: item.name,
          path: item.path,
          title: toTitle(item.name)
        }))
        .sort((a, b) => a.title.localeCompare(b.title));
    }

    function renderMenu(files) {
      menuEl.innerHTML = "";
      for (const file of files) {
        const a = document.createElement("a");
        a.href = "#/" + encodeURIComponent(file.path);
        a.textContent = file.title;
        a.dataset.path = file.path;
        a.className = "menu-item";
        menuEl.appendChild(a);
      }
    }

    function setActive(path) {
      const links = menuEl.querySelectorAll(".menu-item");
      links.forEach(link => {
        if (link.dataset.path === path) link.classList.add("active");
        else link.classList.remove("active");
      });
    }

    function pathFromHash() {
      const hash = window.location.hash || "";
      if (!hash.startsWith("#/")) return "";
      return decodeURIComponent(hash.slice(2));
    }

    async function loadPage(path) {
      try {
        const res = await fetch(rawUrl(path));
        if (!res.ok) throw new Error("Failed to load markdown file.");
        const md = await res.text();

        const renderer = new marked.Renderer();

        renderer.link = function(href, title, text) {
          const safeHref = resolveRelativeUrl(path, href);
          const t = title ? ' title="' + title + '"' : "";
          return '<a href="' + safeHref + '"' + t + ' target="_blank" rel="noopener noreferrer">' + text + "</a>";
        };

        renderer.image = function(href, title, text) {
          const safeHref = resolveRelativeUrl(path, href);
          const t = title ? ' title="' + title + '"' : "";
          const alt = text || "";
          return '<img src="' + safeHref + '" alt="' + alt + '"' + t + " />";
        };

        marked.setOptions({ renderer: renderer, gfm: true, breaks: false });
        const html = marked.parse(md);
        contentEl.innerHTML = DOMPurify.sanitize(html);

        const fileName = path.split("/").pop() || path;
        pageTitleEl.textContent = toTitle(fileName);
        setActive(path);
      } catch (err) {
        pageTitleEl.textContent = "Error";
        contentEl.innerHTML = '<p class="muted">' + err.message + "</p>";
      }
    }

    async function boot() {
      try {
        const files = await getMarkdownFiles();

        if (!files.length) {
          pageTitleEl.textContent = "No Pages";
          contentEl.innerHTML = '<p class="muted">No markdown files found in notes.</p>';
          return;
        }

        renderMenu(files);

        let target = pathFromHash();
        if (!target || !files.some(f => f.path === target)) {
          target = files[0].path;
          window.location.hash = "#/" + encodeURIComponent(target);
        }

        await loadPage(target);
      } catch (err) {
        pageTitleEl.textContent = "Setup Needed";
        contentEl.innerHTML = '<p class="muted">' + err.message + "</p>";
      }
    }

    window.addEventListener("hashchange", () => {
      const path = pathFromHash();
      if (path) loadPage(path);
    });

    boot();
  </script>
</body>
</html>
